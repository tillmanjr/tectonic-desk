# Checks every pull request into main or release once, on the merge commit GitHub builds for
# the PR, so the check gates the merge. There is no push trigger: main and release only move
# through pull requests, and a push trigger would run the same tree a second time after the
# merge. The Deploy workflow runs its own check on the release push before building images.
name: CI

on:
  pull_request:
    branches: [main, release]

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Server integration tests start Postgres through Testcontainers on the runner's Docker.
      - run: pnpm test:coverage
      - run: pnpm build
