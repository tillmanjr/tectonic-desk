services:
  postgres:
    image: postgres:16-alpine
    container_name: tectonic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tectonic
      POSTGRES_PASSWORD: tectonic
      POSTGRES_DB: tectonic
    ports:
      - "5433:5432"
    volumes:
      - tectonic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tectonic -d tectonic"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles: [prod]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tectonic:tectonic@postgres:5432/tectonic
      INGEST_ENABLED: "true"
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: [prod]
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  tectonic-pgdata:
